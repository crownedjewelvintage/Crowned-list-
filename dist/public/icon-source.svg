<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background: deep emerald with rounded square (iOS-style) -->
  <rect width="512" height="512" rx="112" fill="#0a3a2a"/>
  <!-- Subtle inner highlight band (top half lighter) -->
  <rect width="512" height="256" rx="112" fill="#0f4a37" fill-opacity="0.6"/>
  <!-- Crown: 5-peak with V cuts -->
  <path
    d="M88 220 L168 320 L216 184 L256 280 L296 184 L344 320 L424 220 L408 416 L104 416 Z"
    fill="#d4a73a"
    stroke="#8a6418"
    stroke-width="8"
    stroke-linejoin="round"
  />
  <!-- Crown band (gold, slightly darker) -->
  <rect x="104" y="394" width="304" height="46" rx="10" fill="#a8801f"/>
  <!-- Pearl row on band -->
  <circle cx="148" cy="417" r="7" fill="#fff8e0"/>
  <circle cx="208" cy="417" r="7" fill="#fff8e0"/>
  <circle cx="256" cy="417" r="7" fill="#fff8e0"/>
  <circle cx="304" cy="417" r="7" fill="#fff8e0"/>
  <circle cx="364" cy="417" r="7" fill="#fff8e0"/>
  <!-- Emerald gems on the three peaks -->
  <circle cx="168" cy="324" r="16" fill="#0a3a2a" stroke="#072018" stroke-width="3"/>
  <circle cx="256" cy="288" r="20" fill="#0a3a2a" stroke="#072018" stroke-width="3"/>
  <circle cx="344" cy="324" r="16" fill="#0a3a2a" stroke="#072018" stroke-width="3"/>
  <!-- Tiny highlight on center gem -->
  <circle cx="248" cy="280" r="5" fill="#1f9268"/>
</svg>
